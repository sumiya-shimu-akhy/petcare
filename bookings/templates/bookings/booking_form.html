<h1>Book {{ provider.user.username }} ({{ provider.get_service_type_display }})</h1>
<p>Area: {{ provider.area }} | Fee: {{ provider.fee }} BDT</p>

{% if not form.fields.pet.queryset.exists %}
  <p style="color:red;">You need to add a pet first. <a href="/pets/add/">Add a pet</a></p>
{% endif %}

<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Send request</button>
</form>
<a href="/providers/{{ provider.id }}/">&larr; Back</a>
