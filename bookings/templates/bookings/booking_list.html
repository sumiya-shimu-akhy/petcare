<h1>My Bookings</h1>
<a href="/">Home</a> | <a href="/providers/">Find providers</a>
<hr>
{% for b in bookings %}
  <div>
    <h3>{{ b.provider.user.username }} - {{ b.provider.get_service_type_display }}</h3>
    <p>Pet: {{ b.pet.name }} | Date: {{ b.date }} | Status: <b>{{ b.get_status_display }}</b></p>
    <p>Note: {{ b.note }}</p>
  </div>
  <hr>
{% empty %}
  <p>No bookings yet.</p>
{% endfor %}
