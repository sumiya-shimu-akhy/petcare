<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Pet Care Finder{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">
  <nav class="bg-indigo-600 text-white">
    <div class="max-w-4xl mx-auto px-4 py-3 flex flex-wrap items-center gap-4">
      <a href="/" class="font-bold text-lg">🐾 Pet Care Finder</a>
      <a href="/providers/" class="hover:underline">Find Providers</a>
      <a href="/providers/match/" class="hover:underline">Smart Match</a>
            <a href="/providers/chat/" class="hover:underline">AI Assistant</a>
      {% if user.is_authenticated %}
        <a href="/pets/" class="hover:underline">My Pets</a>
        <a href="/bookings/mine/" class="hover:underline">My Bookings</a>
        <a href="/providers/profile/" class="hover:underline">Provider Profile</a>
        <a href="/bookings/requests/" class="hover:underline">Requests</a>
        <form method="post" action="/logout/" class="ml-auto">
          {% csrf_token %}
          <button type="submit" class="bg-white text-indigo-600 px-3 py-1 rounded hover:bg-gray-100">Logout ({{ user.username }})</button>
        </form>
      {% else %}
        <a href="/login/" class="ml-auto hover:underline">Login</a>
        <a href="/signup/" class="bg-white text-indigo-600 px-3 py-1 rounded hover:bg-gray-100">Sign up</a>
      {% endif %}
    </div>
  </nav>
  <main class="max-w-4xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    window.addEventListener('load', function () {
      if (typeof gsap === 'undefined') return;
      gsap.from('nav', {y: -60, opacity: 0, duration: 0.6, ease: 'power2.out'});
      gsap.from('main > *', {y: 24, opacity: 0, duration: 0.6, stagger: 0.12, delay: 0.2, ease: 'power2.out'});
    });
  </script>
</body>
</html>
