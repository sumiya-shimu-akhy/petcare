{% extends "base.html" %}

{% block content %}
<h1 class="text-2xl font-bold mb-1">Pet Care Assistant</h1>
<p class="text-sm text-gray-600 mb-3">Ask in Bangla or English, for example: "I need a vet in Chittagong under 1500 BDT".</p>

<div class="bg-white rounded-lg shadow p-4">
  <div id="chat-box" class="h-80 overflow-y-auto space-y-2 mb-3"></div>
  <form id="chat-form" class="flex gap-2">
    <input id="chat-input" type="text" maxlength="500" autocomplete="off" placeholder="Type your question..."
           class="border rounded flex-1 px-3 py-2">
    <button id="chat-send" type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">Send</button>
  </form>
  <p class="text-xs text-gray-500 mt-2">AI can make mistakes. Check provider details before booking. Do not share private information.</p>
</div>

<script>
const csrfToken = '{{ csrf_token }}';
const box = document.getElementById('chat-box');
const form = document.getElementById('chat-form');
const input = document.getElementById('chat-input');
const sendBtn = document.getElementById('chat-send');
let history = [];

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function linkify(text) {
  return escapeHtml(text)
    .replace(/\/providers\/(\d+)\//g, '<a href="/providers/$1/" class="text-indigo-600 underline">/providers/$1/</a>')
    .replace(/\n/g, '<br>');
}

function addMessage(role, text) {
  const row = document.createElement('div');
  row.className = role === 'user' ? 'flex justify-end' : 'flex justify-start';
  const bubble = document.createElement('div');
  bubble.className = 'max-w-[85%] rounded-lg px-3 py-2 text-sm ' +
    (role === 'user' ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-800');
  if (role === 'user') { bubble.textContent = text; } else { bubble.innerHTML = linkify(text); }
  row.appendChild(bubble);
  box.appendChild(row);
  box.scrollTop = box.scrollHeight;
  return bubble;
}

addMessage('bot', 'Hello! Tell me what your pet needs, your area and your budget, and I will suggest providers.');

form.addEventListener('submit', function (e) {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;
  addMessage('user', message);
  input.value = '';
  sendBtn.disabled = true;
  const bubble = addMessage('bot', 'Typing...');

  fetch('/providers/chat/api/', {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'X-CSRFToken': csrfToken},
    body: JSON.stringify({message: message, history: history})
  })
    .then(res => res.json())
    .then(data => {
      const reply = data.reply || 'Something went wrong.';
      bubble.innerHTML = linkify(reply);
      history.push({role: 'user', text: message});
      history.push({role: 'bot', text: reply});
      history = history.slice(-6);
    })
    .catch(() => { bubble.textContent = 'Could not reach the server. Please try again.'; })
    .finally(() => { sendBtn.disabled = false; input.focus(); box.scrollTop = box.scrollHeight; });
});
</script>
{% endblock %}
