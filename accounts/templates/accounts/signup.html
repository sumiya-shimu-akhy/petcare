{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-lg shadow p-6">
  <h1 class="text-2xl font-bold mb-4">Sign Up</h1>
  <form method="post" class="space-y-3">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded hover:bg-indigo-700">Sign Up</button>
  </form>
  <p class="mt-4 text-sm text-gray-600">Already have an account? <a href="/login/" class="text-indigo-600 hover:underline">Login</a></p>
</div>

<script>
const usernameInput = document.getElementById('id_username');
const message = document.createElement('span');
usernameInput.insertAdjacentElement('afterend', message);
let timer;

usernameInput.addEventListener('input', () => {
  clearTimeout(timer);
  const value = usernameInput.value.trim();
  if (!value) {
    message.textContent = '';
    return;
  }
  timer = setTimeout(() => {
    fetch('/check-username/?username=' + encodeURIComponent(value))
      .then(response => response.json())
      .then(data => {
        if (data.exists) {
          message.textContent = ' ❌ Already taken';
          message.style.color = 'red';
        } else {
          message.textContent = ' ✅ Available';
          message.style.color = 'green';
        }
      });
  }, 300);
});
</script>
{% endblock %}
