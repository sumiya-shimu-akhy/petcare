{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-lg shadow p-6">
  <h1 class="text-2xl font-bold mb-2">Verify your email</h1>
  <p class="text-sm text-gray-600 mb-4">We sent a 6-digit code to <b>{{ email }}</b>.</p>

  {% if error %}
    <p class="text-red-600 mb-3">{{ error }}</p>
  {% endif %}

  <form method="post" class="space-y-3">
    {% csrf_token %}
    <input type="text" name="code" maxlength="6" inputmode="numeric" placeholder="Enter 6-digit code"
           class="border rounded w-full px-3 py-2 tracking-widest text-center text-lg" required>
    <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded hover:bg-indigo-700">Verify</button>
  </form>

  <form method="post" action="/verify/resend/" class="mt-3 text-center">
    {% csrf_token %}
    <button type="submit" class="text-sm text-indigo-600 hover:underline">Resend code</button>
  </form>
</div>
{% endblock %}
